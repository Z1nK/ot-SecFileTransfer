# Example server config. Relative paths are resolved against this file's directory.

instance_name = "siteA"          # [A-Za-z0-9._-], used in `bob@siteA`

[storage]
root = "/var/lib/confide"        # holds tmp/ and transactions/

[rest]
bind = "0.0.0.0"                 # IP or host name (resolved at startup)
port = 8080
threads = 0                      # 0 = number of cores
request_timeout_ms = 30000

[tls]
enabled = true                   # set false for local testing only
cert = "/etc/confide/cert.pem"
key = "/etc/confide/key.pem"
# ca = "/etc/confide/ca.pem"     # verifies peers; default = system CAs

[auth]
provider = "local"               # "local" (users/groups below) or "ldap" (needs -DWITH_LDAP=ON)
token_ttl_s = 3600               # ftc login token lifetime
token_idle_s = 900               # token dropped after this long unused
users_file = "users"             # `name:password_hash` per line, see users.example; chmod 600
groups_file = "groups"           # optional, `name:member,member` per line, see groups.example

# Users can also be listed here instead of (or as well as) in users_file:
# [[user]]
# name = "carol"
# password_hash = "<hash>"       # from `confide-passwd`; plaintext `password` is rejected

# Groups too, as well as or instead of groups_file:
# [[group]]
# name = "ops"
# members = ["carol"]

# With provider = "ldap", users and groups come from the directory instead, and
# the local users/groups settings above are ignored. Values for the test
# instance in docker/docker-compose.yml:
# [auth.ldap]
# preset = "openldap"            # or "active_directory" (sAMAccountName, nested groups)
# uri = "ldap://localhost:1389"  # ldaps://... or start_tls = true outside of tests
# start_tls = false
# tls_verify = true
# ca_file = ""                   # PEM bundle; empty = system default
# timeout_s = 5
# bind_dn = "cn=admin,dc=example,dc=org"   # read-only service account; empty = anonymous
# bind_password_file = "ldap_bind"         # or bind_password = "..."; chmod 600
# user_base_dn = "ou=people,dc=example,dc=org"
# group_base_dn = "ou=groups,dc=example,dc=org"   # empty = no groups
# user_filter = ""               # empty = preset default, e.g. "(&(objectClass=inetOrgPerson)(uid={username}))"
# cache_ttl_s = 300              # reuse verified passwords and lookups; 0 = always ask

[log]
level = "info"                   # trace | debug | info | warn | error
dir = "/var/log/confide"         # default: <storage.root>/logs
rotate_bytes = 67108864          # 0 = never rotate

[retention]
default_days = 30
max_days = 365
sweep_interval_s = 3600

[[peer]]
name = "siteB"
host = "siteb.example.org"
port = 8080
token = "<token we send to siteB>"
accept_token = "<token siteB sends to us>"
