name: 'C++ CI SecFileTransfer'

# Release on version tags: `git tag v1.2.3 && git push origin v1.2.3`.
on:
  push:
    tags:
      - 'v*'

env:
  CONFIGURE_PRESET: x64-release-linux
  BUILD_DIR: build
  VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/.vcpkg-cache

jobs:
  build:
    name: Build & Package
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Version from tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::tag '$GITHUB_REF_NAME' is not vX.Y.Z"
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-14 ninja-build pkg-config \
            libboost-json-dev libboost-program-options-dev libssl-dev libldap-dev

      - name: Setup vcpkg
        run: |
          git clone https://github.com/microsoft/vcpkg.git "$RUNNER_TEMP/vcpkg"
          "$RUNNER_TEMP/vcpkg/bootstrap-vcpkg.sh" -disableMetrics
          echo "VCPKG_ROOT=$RUNNER_TEMP/vcpkg" >> "$GITHUB_ENV"
          mkdir -p "$VCPKG_DEFAULT_BINARY_CACHE"

      - name: Cache vcpkg binaries
        uses: actions/cache@v4
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: vcpkg-${{ runner.os }}-gcc14-${{ hashFiles('vcpkg.json') }}
          restore-keys: vcpkg-${{ runner.os }}-gcc14-

      - name: Configure
        run: |
          cmake --preset ${{ env.CONFIGURE_PRESET }} \
            -DCMAKE_CXX_COMPILER=g++-14 \
            -DCMAKE_C_COMPILER=gcc-14 \
            -DAPP_VERSION=${{ env.VERSION }}

      - name: Build
        run: cmake --build --preset ${{ env.CONFIGURE_PRESET }}

      - name: Run tests
        run: ctest --test-dir ${{ env.BUILD_DIR }} --output-on-failure

      - name: Check reported version
        run: |
          ./${{ env.BUILD_DIR }}/bin/confide-server --version | grep -Fx "confide-server ${{ env.VERSION }}"

      - name: Create package
        run: cmake --build --preset ${{ env.CONFIGURE_PRESET }} --target package

      - name: Upload .deb artifacts
        uses: actions/upload-artifact@v4
        with:
          name: deb-packages
          # confide, confide-utils and confide-client
          path: ${{ env.BUILD_DIR }}/*_${{ env.VERSION }}_*.deb
          if-no-files-found: error
          retention-days: 1

  release:
    name: Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download .deb artifacts
        uses: actions/download-artifact@v4
        with:
          name: deb-packages

      - name: Create GitHub Release and upload asset
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --repo ${{ github.repository }} \
            --title "Release ${GITHUB_REF_NAME#v}" \
            --generate-notes \
            ./*.deb
