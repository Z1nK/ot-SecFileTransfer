name: 'C++ CI SecFileTransfer'

# Release on version tags: `git tag v1.2.3 && git push origin v1.2.3`.
on:
  push:
    tags:
      - 'v*'

env:
  CONFIGURE_PRESET: x64-release-linux
  BUILD_DIR: build
  VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/.vcpkg-cache

jobs:
  build-deb:
    name: Build & Package (.deb)
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Version from tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::tag '$GITHUB_REF_NAME' is not vX.Y.Z"
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-14 ninja-build pkg-config \
            libboost-json-dev libboost-program-options-dev libssl-dev libldap-dev

      - name: Setup vcpkg
        run: |
          git clone https://github.com/microsoft/vcpkg.git "$RUNNER_TEMP/vcpkg"
          "$RUNNER_TEMP/vcpkg/bootstrap-vcpkg.sh" -disableMetrics
          echo "VCPKG_ROOT=$RUNNER_TEMP/vcpkg" >> "$GITHUB_ENV"
          mkdir -p "$VCPKG_DEFAULT_BINARY_CACHE"

      - name: Cache vcpkg binaries
        uses: actions/cache@v4
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: vcpkg-${{ runner.os }}-gcc14-${{ hashFiles('vcpkg.json') }}
          restore-keys: vcpkg-${{ runner.os }}-gcc14-

      - name: Configure
        run: |
          cmake --preset ${{ env.CONFIGURE_PRESET }} \
            -DCMAKE_CXX_COMPILER=g++-14 \
            -DCMAKE_C_COMPILER=gcc-14 \
            -DAPP_VERSION=${{ env.VERSION }}

      - name: Build
        run: cmake --build --preset ${{ env.CONFIGURE_PRESET }}

      - name: Run tests
        run: ctest --test-dir ${{ env.BUILD_DIR }} --output-on-failure

      - name: Check reported version
        run: |
          ./${{ env.BUILD_DIR }}/bin/confide-server --version | grep -Fx "confide-server ${{ env.VERSION }}"

      - name: Create package
        run: cmake --build --preset ${{ env.CONFIGURE_PRESET }} --target package

      - name: Upload .deb artifacts
        uses: actions/upload-artifact@v4
        with:
          name: packages-deb
          # confide, confide-utils and confide-client
          path: ${{ env.BUILD_DIR }}/*_${{ env.VERSION }}_*.deb
          if-no-files-found: error
          retention-days: 1

  # Each RHEL major needs its own build: Ubuntu binaries want a newer glibc,
  # OpenSSL and OpenLDAP. gcc-toolset-14 links the newer libstdc++ parts
  # statically, Boost comes from vcpkg (EL8 has 1.66, EL9 1.75), OpenSSL
  # (1.1.1 / 3.0) and OpenLDAP (2.4 / 2.6) are the system ones.
  build-rpm:
    name: Build & Package (.rpm, EL${{ matrix.el }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - el: 8
            image: almalinux:8
            devel_repo: powertools
          - el: 9
            image: almalinux:9
            devel_repo: crb
    container: ${{ matrix.image }}
    defaults:
      run:
        shell: bash
    steps:
      # git before checkout, otherwise it downloads a tarball without submodules.
      - name: Install system dependencies
        run: |
          dnf -y install dnf-plugins-core
          dnf config-manager --set-enabled ${{ matrix.devel_repo }}
          # --allowerasing: EL9 images ship curl-minimal, which conflicts with curl.
          dnf -y install --allowerasing gcc-toolset-14 cmake ninja-build git curl zip unzip tar perl \
            pkgconf-pkg-config openssl-devel openldap-devel rpm-build
          echo /opt/rh/gcc-toolset-14/root/usr/bin >> "$GITHUB_PATH"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Version from tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::tag '$GITHUB_REF_NAME' is not vX.Y.Z"
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      # ${{ github.workspace }} is the host path; inside the container the
      # workspace is $GITHUB_WORKSPACE.
      - name: Setup vcpkg
        run: |
          git clone https://github.com/microsoft/vcpkg.git "$RUNNER_TEMP/vcpkg"
          "$RUNNER_TEMP/vcpkg/bootstrap-vcpkg.sh" -disableMetrics
          echo "VCPKG_ROOT=$RUNNER_TEMP/vcpkg" >> "$GITHUB_ENV"
          echo "VCPKG_DEFAULT_BINARY_CACHE=$GITHUB_WORKSPACE/.vcpkg-cache" >> "$GITHUB_ENV"
          mkdir -p "$GITHUB_WORKSPACE/.vcpkg-cache"

      - name: Cache vcpkg binaries
        uses: actions/cache@v4
        with:
          path: .vcpkg-cache
          key: vcpkg-el${{ matrix.el }}-gcc14-${{ hashFiles('vcpkg.json') }}
          restore-keys: vcpkg-el${{ matrix.el }}-gcc14-

      - name: Configure
        run: |
          g++ --version
          cmake --preset ${{ env.CONFIGURE_PRESET }} \
            -DAPP_VERSION=${{ env.VERSION }} \
            -DVCPKG_MANIFEST_FEATURES=boost

      - name: Build
        run: cmake --build --preset ${{ env.CONFIGURE_PRESET }}

      - name: Run tests
        run: ctest --test-dir ${{ env.BUILD_DIR }} --output-on-failure

      - name: Check reported version
        run: |
          ./${{ env.BUILD_DIR }}/bin/confide-server --version | grep -Fx "confide-server ${{ env.VERSION }}"

      - name: Create package
        working-directory: ${{ env.BUILD_DIR }}
        run: cpack -G RPM

      # Boost must be linked statically; the rest must be EL system libraries.
      - name: Inspect packages
        working-directory: ${{ env.BUILD_DIR }}
        run: |
          for rpm in ./*-${{ env.VERSION }}-*.el${{ matrix.el }}.x86_64.rpm; do
            echo "== $rpm"
            rpm -qpi "$rpm"
            rpm -qpl "$rpm"
            rpm -qpR "$rpm" | tee requires.txt
            if grep -q libboost requires.txt; then
              echo "::error::$rpm depends on a shared Boost library"
              exit 1
            fi
          done

      - name: Upload .rpm artifacts
        uses: actions/upload-artifact@v4
        with:
          name: packages-rpm-el${{ matrix.el }}
          # confide, confide-utils and confide-client
          path: ${{ env.BUILD_DIR }}/*-${{ env.VERSION }}-*.el${{ matrix.el }}.x86_64.rpm
          if-no-files-found: error
          retention-days: 1

  # Install on a clean EL (a different rebuild than the build image) to catch
  # missing runtime dependencies.
  test-rpm:
    name: Install test (.rpm, EL${{ matrix.el }})
    needs: build-rpm
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        el: [8, 9]
    container: rockylinux:${{ matrix.el }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Download .rpm artifacts
        uses: actions/download-artifact@v4
        with:
          name: packages-rpm-el${{ matrix.el }}

      - name: Install
        run: dnf -y install ./*.rpm

      - name: Run binaries
        run: |
          confide-server --version
          ftc --help
          echo secret | confide-passwd

      - name: Check server files
        run: |
          getent passwd confide
          test "$(stat -c '%U:%G %a' /etc/confide/server.toml)" = "root:confide 640"
          rpm -qc confide | grep -Fx /etc/confide/server.toml
          test -f /usr/lib/systemd/system/confide-server.service

  release:
    name: Release
    needs: [build-deb, test-rpm]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download package artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: packages-*
          merge-multiple: true

      - name: Create GitHub Release and upload assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --repo ${{ github.repository }} \
            --title "Release ${GITHUB_REF_NAME#v}" \
            --generate-notes \
            ./*.deb ./*.rpm
